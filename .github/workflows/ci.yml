name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # allow manual runs from the Actions UI

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  # =====================================================================
  # build-test
  # Single checkout, single restore, single build, single test.
  # Produces:
  #   - build artifacts (Release output)
  #   - computed NBGV version
  # =====================================================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with full history for NBGV)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NBGV
        run: dotnet tool install --global nbgv

      - name: Compute version
        id: version
        run: |
          nbgv get-version --format json > version.json
          cat version.json

      - name: Upload computed version
        uses: actions/upload-artifact@v7
        with:
          name: nbgv-version
          path: version.json
          retention-days: 7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Aiel.slnx

      - name: Build (Release)
        run: dotnet build Aiel.slnx --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: src/**/bin/Release/
          retention-days: 7

      - name: Run tests
        run: |
          dotnet test Aiel.slnx \
            --configuration Release \
            --no-build \
            --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit Test Results
          path: ./TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: false

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: unittests
          fail_ci_if_error: false

  # =====================================================================
  # pack
  # Only runs on push to main.
  # Reuses:
  #   - build-output artifact
  #   - nbgv-version artifact
  # Performs:
  #   - dotnet pack --no-build
  # =====================================================================
  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source (no need for full history)
        uses: actions/checkout@v7

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: ./build-output

      - name: Download computed version
        uses: actions/download-artifact@v8
        with:
          name: nbgv-version
          path: ./version-info

      - name: Show version used for packing
        run: cat ./version-info/version.json

      # dotnet pack expects the compiled DLLs to be in the project folder structure
      - name: Restore build output into project directories
        run: cp -r ./build-output/src ./src

      - name: Pack Aiel.Logging.Analyzers
        run: |
          dotnet pack src/Aiel.Logging.Analyzers/Aiel.Logging.Analyzers.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Pack Aiel.Logging.CodeFixes
        run: |
          dotnet pack src/Aiel.Logging.CodeFixes/Aiel.Logging.CodeFixes.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      # No upload of .nupkg yet (early alpha)
      # When you are ready, uncomment the step below and set
      # NUGET_API_KEY in your repo secrets to publish automatically
      # on every merge to main.
      #
      # - name: Push to NuGet.org
      #   run: |
      #     dotnet nuget push ./artifacts/*.nupkg \
      #       --api-key ${{ secrets.NUGET_API_KEY }} \
      #       --source https://api.nuget.org/v3/index.json \
      #       --skip-duplicate
